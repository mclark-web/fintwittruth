<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../src/app/gc-scale.css" />
    <style>
      html, body { margin: 0; background: #0b0c0e; color: #f2f1ee; font-family: sans-serif; }
      .sheet { background: #1c1f28; padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
      .orange-row { display: inline-flex; margin: 16px; padding: 12px 16px; background: rgba(235, 101, 5, 0.15); border-radius: 12px; }
      .compact { flex-direction: row; align-items: center; gap: 10px; flex-wrap: wrap; }
      .mini-mark { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 128px; }
      main { display: flex; flex-direction: column; gap: 24px; padding: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="gc-scale is-sidebar" style="--gc-fill: 88%">
        <div class="gc-tube-slot">
          <div class="gc-bloom"></div>
          <div class="gc-tube"><div class="gc-liquid"></div></div>
        </div>
        <div class="gc-meta compact">
          <div class="gc-label">GC Scale</div>
          <div class="gc-pct">88%</div>
          <span class="gc-grade-tag strong" data-grade="strong">STRONG</span>
        </div>
      </div>
      <div class="gc-scale is-sidebar" style="--gc-fill: 55%">
        <div class="gc-tube-slot">
          <div class="gc-bloom"></div>
          <div class="gc-tube"><div class="gc-liquid"></div></div>
        </div>
        <div class="gc-meta compact">
          <div class="gc-label">GC Scale</div>
          <div class="gc-pct">55%</div>
          <span class="gc-grade-tag provisional" data-grade="provisional">PROVISIONAL</span>
        </div>
      </div>
      <div class="gc-scale is-sidebar" style="--gc-fill: 30%">
        <div class="gc-tube-slot">
          <div class="gc-bloom"></div>
          <div class="gc-tube"><div class="gc-liquid"></div></div>
        </div>
        <div class="gc-meta compact">
          <div class="gc-label">GC Scale</div>
          <div class="gc-pct">30%</div>
          <span class="gc-grade-tag weak" data-grade="weak">WEAK</span>
        </div>
      </div>
      <div class="gc-scale is-sidebar" style="--gc-fill: 72%">
        <div class="gc-tube-slot">
          <div class="gc-bloom"></div>
          <div class="gc-tube"><div class="gc-liquid"></div></div>
        </div>
        <div class="gc-meta">
          <div class="gc-label">GC Scale</div>
          <div class="gc-pct">72%</div>
          <span class="gc-grade-tag strong" data-grade="strong">STRONG</span>
        </div>
      </div>
      <div class="mini-mark">
        <span class="gc-grade-tag strong" data-grade="strong">STRONG</span>
        <div class="gc-scale is-mini" style="--gc-fill: 88%; width: 128px">
          <div class="gc-tube-slot">
            <div class="gc-tube"><div class="gc-liquid"></div></div>
          </div>
        </div>
      </div>
      <a class="orange-row" href="#row">
        <span class="gc-grade-tag strong" data-grade="strong">STRONG</span>
      </a>
      <div class="sheet">
        <span class="gc-grade-tag strong" data-grade="strong">STRONG</span>
        <span class="gc-grade-tag weak" data-grade="weak">WEAK</span>
        <span class="gc-grade-tag provisional" data-grade="provisional">PROVISIONAL</span>
        <span class="gc-grade-tag exit" data-grade="exit">EXIT LIQUIDITY</span>
      </div>
    </main>
  </body>
</html>
