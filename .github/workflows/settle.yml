name: settle

on:
  schedule:
    # 21:05 UTC is 5:05 PM EDT, after the 4:45 PM ET buffer.
    # 22:15 UTC is 5:15 PM EST, after the same buffer once daylight time ends.
    - cron: "5 21 * * 3,5"
    - cron: "15 22 * * 3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run settle
      - run: npm test
      - run: npm run accuracy
      - name: Commit settled closes
        run: |
          if git diff --quiet -- src/lib/market-history.json; then
            echo "No due checkpoint changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/market-history.json
          git commit -m "Settle due Wednesday and Friday closes from Yahoo."
          git push
